[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insignal-b2b-prospector"
version = "0.1.0"
description = "InSignal: LinkedIn Keyword Signal Monitor & B2B Lead Intelligence Engine. Real-time post signal tracking, decision-maker scoring, and DNS MX verified corporate contacts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jignesh Kumar" }]
dependencies = ["curl_cffi>=0.7", "playwright>=1.40"]

[project.scripts]
insignal = "linkedin_listener.cli:main"
linkedin-listener = "linkedin_listener.cli:main"
linkedin-signal-monitor = "linkedin_listener.signal:main"
linkedin-signal = "linkedin_listener.signal:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkedin_listener = ["data/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "BLE001", # blind except is deliberate around network calls
  "S110",   # try-except-pass is deliberate around best-effort waits
  "S112",   # try-except-continue is deliberate in retry loops
  "SIM115", # writers intentionally hold open file handles
]
